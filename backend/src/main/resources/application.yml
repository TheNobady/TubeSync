spring:
  application:
    name: TubeSync

  datasource:
    url: jdbc:postgresql://localhost:5432/tubesync
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  security:
    # We handle auth manually via JWT filter — disable form login
    user:
      name: disabled

server:
  port: 8080

app:
  cors:
    allowed-origins: http://localhost:3000
  nextauth:
    # IMPORTANT: must match NEXTAUTH_SECRET in frontend/.env.local
    secret: ${NEXTAUTH_SECRET:dev-secret-change-in-production-must-be-32-chars-min}
